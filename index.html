ble-wrap{max-height:none}.dashboard-table{min-width:720px}.bar-cell{min-width:190px}.bar-track{height:16px;border-radius:999px;background:#edf0f2;overflow:hidden}.bar-fill{height:100%;border-radius:999px;background:var(--teal)}.priority-list{display:grid;gap:10px;padding:16px}.priority-item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfb}.priority-item strong{font-size:14px}.priority-item small{color:var(--muted)}.badge-warn{background:#fff2d8;color:#8a4a04;border-radius:999px;padding:4px 8px;font-size:12px;font-weight:800}.empty-priority{color:var(--muted);padding:10px 12px}.auth-screen{position:fixed;inset:0;z-index:50;background:#edf1ef;display:grid;place-items:center;padding:20px}.auth-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:24px;display:grid;gap:16px}.auth-card h2{margin:0;font-size:24px}.auth-card p{margin:0;color:var(--muted);line-height:1.5}.modal-backdrop{position:fixed;inset:0;z-index:40;background:rgba(18,27,32,.42);display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(920px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:8px;box-shadow:var(--shadow);border:1px solid var(--line)}.modal-body{padding:16px;display:grid;gap:16px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.compact-table{min-width:700px}.compact-table td,.compact-table th{font-size:13px}.storage-status{padding:10px 12px;border-radius:8px;background:#edf5f4;color:#275c58;border:1px solid #b9ddda;font-size:13px;line-height:1.45}.storage-status.warning{background:#fff0f2;color:#8e2f40;border-color:#f0bdc7}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#1f2a31;color:#fff;padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.18s;z-index:60}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.error{padding:12px;border-radius:8px;background:#fff0f2;color:#8e2f40;border:1px solid #f0bdc7;display:none}.loading{padding:26px 16px;color:var(--muted);text-align:center}@media(max-width:1180px){.list-layout,.dashboard-grid{grid-template-columns:1fr}.detail-panel{position:static;max-height:none}}@media(max-width:860px){.topbar{align-items:flex-start;flex-direction:column}.top-actions{justify-content:flex-start}.filters,.form-grid{grid-template-columns:1fr 1fr}.summary-grid,.dashboard-metrics{grid-template-columns:1fr 1fr}}@media(max-width:560px){.topbar,.tabs,.filters,main{padding-left:14px;padding-right:14px}.filters,.summary-grid,.dashboard-metrics,.status-buttons,.form-grid{grid-template-columns:1fr}}

<body>
  <section class="auth-screen" id="authScreen"><form class="auth-card" id="loginForm"><div class="brand"><div class="brand-mark"><i data-lucide="factory"></i></div><div><h2>善水工商地產-工廠客戶拜訪管理系統</h2><p>請登入後使用系統。</p></div></div><div class="field"><label for="loginUsername">帳號</label><input id="loginUsername" autocomplete="username" value="admin" required></div><div class="field"><label for="loginPassword">密碼</label><input id="loginPassword" type="password" autocomplete="current-password" value="admin123" required></div><div class="error" id="loginError"></div><button class="primary-button" type="submit"><i data-lucide="log-in"></i>登入</button><p class="subtext">預設管理員：admin / admin123。正式使用前請新增管理員並停用預設帳號。</p></form></section>
  <div class="app-shell hidden" id="appShell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><i data-lucide="factory"></i></div>
        <h1><span>善水工商地產</span><span class="brand-divider">-</span><span class="brand-product">工廠客戶拜訪管理系統</span></h1>
      </div>
      <div class="top-actions">
        <span class="user-chip" id="userChip"></span>
        <button class="icon-button" id="refreshBtn" type="button" title="重新載入" aria-label="重新載入"><i data-lucide="refresh-cw"></i></button>
        <details class="command-menu">
          <summary class="icon-button" title="管理與工具" aria-label="管理與工具"><i data-lucide="ellipsis"></i></summary>
          <div class="command-menu-items">
            <button class="ghost-button hidden" id="importCustomersBtn" type="button"><i data-lucide="file-up"></i>匯入特登名單</button>
            <button class="ghost-button" id="usersBtn"><i data-lucide="users"></i>使用者管理</button>
            <button class="ghost-button" id="salespeopleBtn"><i data-lucide="briefcase-business"></i>業務人員</button>
            <button class="ghost-button" id="logsBtn"><i data-lucide="list-checks"></i>操作記錄</button>
            <button class="ghost-button" id="exportBtn"><i data-lucide="download"></i>匯出追蹤</button>
            <a class="ghost-button hidden" id="sheetLink" target="_blank" rel="noopener noreferrer"><i data-lucide="external-link"></i>開啟客戶總表</a>
            <button class="ghost-button danger-button" id="logoutBtn"><i data-lucide="log-out"></i>登出</button>
          </div>
        </details>
      </div>
    </header>
    <nav class="tabs" aria-label="主要頁面">
      <button class="tab-button active" data-view="list" type="button" aria-pressed="true"><i data-lucide="contact-round"></i>客戶工作台</button>
      <button class="tab-button" data-view="dashboard" type="button" aria-pressed="false"><i data-lucide="chart-no-axes-combined"></i>數據儀表板</button>
    </nav>
    <section class="filters" id="filtersBar" aria-label="客戶篩選">
      <div class="field search-field">
        <label for="searchInput">搜尋客戶</label>
        <div class="input-wrap"><i data-lucide="search"></i><input id="searchInput" type="search" placeholder="公司、廠編、電話或地址"></div>
      </div>
      <div class="field"><label for="regionFilter">區域</label><select id="regionFilter"></select></div>
      <div class="field"><label for="gradeFilter">客戶分級</label><select id="gradeFilter"></select></div>
      <div class="filter-actions">
        <details class="more-filters">
          <summary class="ghost-button"><i data-lucide="sliders-horizontal"></i>更多篩選<span id="filterCount"></span></summary>
          <div class="more-filter-fields">
            <div class="field"><label for="statusFilter">追蹤狀態</label><select id="statusFilter"><option value="">全部狀態</option><option value="todo">未處理</option><option value="follow">待追蹤</option><option value="visited">已拜訪</option><option value="closed">暫不處理</option></select></div>
            <div class="field"><label for="quickFilter">回報與聯絡</label><select id="quickFilter"><option value="">全部名單</option><option value="hasPhone">有電話</option><option value="hasFeedback">已有拜訪回報</option><option value="needsFeedback">尚無拜訪回報</option></select></div>
          </div>
        </details>
        <button class="icon-button" id="resetBtn" type="button" title="清除全部篩選" aria-label="清除全部篩選"><i data-lucide="rotate-ccw"></i></button>
      </div>
    </section>
    <main class="list-view" id="listView">
      <section class="summary-grid" id="summaryGrid" aria-label="客戶概況"></section>
      <div class="list-layout">
        <section class="list-panel" aria-labelledby="customerListTitle">
          <div class="panel-head"><h2 id="customerListTitle">客戶名單</h2><span class="count-pill" id="resultCount" aria-live="polite">0 筆</span></div>
          <div class="error" id="errorBox" role="alert"></div>
          <div class="loading" id="loadingBox" role="status">正在載入客戶名單…</div>
          <div class="table-wrap customer-list-scroll">
            <table class="customer-table">
              <thead><tr><th scope="col">公司</th><th scope="col">分級</th><th scope="col">追蹤</th></tr></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </section>
        <aside class="detail-panel" id="detailPanel" aria-label="目前客戶"></aside>
      </div>
    </main>
    <main class="dashboard-view hidden" id="dashboardView"><div id="dashboardContent"></div></main>
  </div>
  <section class="modal-backdrop" id="usersModal"><div class="modal"><div class="panel-head"><h2>使用者管理</h2><button class="mini-button" data-close="usersModal"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="storage-status" id="usersStorageStatus">正在檢查儲存狀態...</div><form class="form-grid" id="userForm"><div class="field"><label>帳號</label><input id="newUsername" required></div><div class="field"><label>名稱</label><input id="newDisplayName"></div><div class="field"><label>角色</label><select id="newRole"><option value="user">一般使用者</option><option value="admin">管理員</option></select></div><div class="field"><label>密碼</label><input id="newPassword" type="password" required></div><button class="primary-button" type="submit"><i data-lucide="user-plus"></i>新增</button></form><div class="table-wrap"><table class="compact-table"><thead><tr><th>帳號</th><th>名稱</th><th>角色</th><th>狀態</th><th>新密碼</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table></div></div></div></section>
  <section class="modal-backdrop" id="salespeopleModal"><div class="modal"><div class="panel-head"><h2>業務人員名單</h2><button class="mini-button" data-close="salespeopleModal"><i data-lucide="x"></i></button></div><div class="modal-body"><form class="form-grid" id="salespersonForm"><div class="field"><label>業務姓名</label><input id="newSalespersonName" required></div><div class="field"><label>狀態</label><select id="newSalespersonActive"><option value="true">啟用</option><option value="false">停用</option></select></div><button class="primary-button" type="submit"><i data-lucide="plus"></i>新增業務</button></form><div class="table-wrap"><table class="compact-table"><thead><tr><th>業務姓名</th><th>狀態</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="salespeopleBody"></tbody></table></div></div></div></section>
  <section class="modal-backdrop" id="logsModal"><div class="modal"><div class="panel-head"><h2>操作記錄</h2><button class="mini-button" data-close="logsModal"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="table-wrap"><table class="compact-table"><thead><tr><th>時間</th><th>使用者</th><th>動作</th><th>結果</th><th>內容</th></tr></thead><tbody id="logsBody"></tbody></table></div></div></div></section><div class="toast" id="toast" role="status"></div>
  <dialog id="customerImportDialog" class="modal import-dialog" aria-labelledby="customerImportTitle">
    <div class="panel-head">
      <h2 id="customerImportTitle">匯入特登名單</h2>
      <button class="mini-button" id="closeCustomerImport" type="button" aria-label="關閉匯入"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <form id="customerImportForm" class="import-form">
        <div class="field"><label for="importRegion">區域</label><select id="importRegion" required></select></div>
        <div id="newImportRegionField" class="field hidden"><label for="newImportRegion">新區域名稱</label><input id="newImportRegion" maxlength="40" disabled></div>
        <div class="field"><label for="importFile">名單檔案（CSV / Excel .xlsx）</label><input id="importFile" type="file" accept=".csv,.xlsx" required></div>
        <div class="import-actions"><button id="importTemplate" type="button" class="ghost-button"><i data-lucide="download"></i>下載範本</button><button id="previewCustomerImport" class="primary-button" type="submit"><i data-lucide="list-checks"></i>預覽</button></div>
      </form>
      <p id="customerImportMessage" class="import-message" role="status" aria-live="polite"></p>
      <section id="customerImportPreview" class="hidden" aria-label="匯入預覽">
        <div class="import-preview-head"><p id="customerImportTarget"></p><button id="commitCustomerImport" type="button" class="primary-button"><i data-lucide="plus"></i><span id="commitCustomerImportLabel">確認新增</span></button></div>
        <dl class="import-counts" id="customerImportCounts"></dl>
        <div class="import-table-wrap" tabindex="0" role="region" aria-label="預覽結果"><table class="import-table"><thead><tr><th scope="col">列</th><th scope="col">廠編</th><th scope="col">公司名稱</th><th scope="col">結果</th><th scope="col">原因</th></tr></thead><tbody id="customerImportRows"></tbody></table></div>
      </section>
      <details id="customerImportHistory"><summary>最近匯入紀錄</summary><div id="customerImportReceipts"></div></details>
    </div>
  </dialog>
  <script>
    const statusLabels={todo:"未處理",follow:"待追蹤",visited:"已拜訪",closed:"暫不處理"};
    const gradeOptions=["未分級","潛能","D","C","B","A","AA","光多辦理"];
    const highValueGradeFilter="A+AA";
    const state={records:[],filtered:[],selectedId:null,detailPane:"profile",local:{},profiles:{},salespeople:[],currentUser:null,activeView:"list",dashboardSort:"count",dataLoading:false,dataError:"",dataLoadedAt:""};
    const el={};
    document.addEventListener("DOMContentLoaded",()=>{["authScreen","appShell","loginForm","loginUsername","loginPassword","loginError","summaryGrid","tableBody","resultCount","loadingBox","errorBox","detailPanel","searchInput","regionFilter","gradeFilter","statusFilter","quickFilter","resetBtn","refreshBtn","exportBtn","toast","userChip","logoutBtn","usersBtn","salespeopleBtn","logsBtn","usersModal","salespeopleModal","logsModal","userForm","usersBody","logsBody","newUsername","newDisplayName","newRole","newPassword","usersStorageStatus","salespersonForm","newSalespersonName","newSalespersonActive","salespeopleBody","filtersBar","listView","dashboardView","dashboardContent"].forEach(id=>el[id]=document.getElementById(id));bindEvents();refreshIcons();boot();});
    function refreshIcons(){if(window.lucide)lucide.createIcons()}
    async function api(path,options={}){const response=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});if(!response.ok){let payload={};try{payload=await response.json()}catch{}const error=new Error(payload.message||`HTTP ${response.status}`);error.status=response.status;throw error}const type=response.headers.get("content-type")||"";return type.includes("application/json")?response.json():response.text()}
    function bindEvents() {
      el.loginForm.addEventListener("submit", event => {
        event.preventDefault();
        login();
      });
      el.searchInput.addEventListener("input", applyFilters);
      [el.regionFilter, el.gradeFilter, el.statusFilter, el.quickFilter].forEach(select => select.addEventListener("change", applyFilters));
      el.resetBtn.addEventListener("click", () => {
        [el.searchInput, el.regionFilter, el.gradeFilter, el.statusFilter, el.quickFilter].forEach(field => { field.value = ""; });
        document.querySelector(".more-filters").open = false;
        applyFilters();
      });
      el.tableBody.addEventListener("click", event => {
        const row = event.target.closest("tr[data-id]");
        if (row) selectRecord(row.dataset.id);
      });
      const menu = document.querySelector(".command-menu");
      menu.addEventListener("click", event => {
        if (event.target.closest(".command-menu-items button, .command-menu-items a")) menu.open = false;
      });
      const disclosures = [menu, document.querySelector(".more-filters")];
      document.addEventListener("click", event => disclosures.forEach(details => {
        if (!details.contains(event.target)) details.open = false;
      }));
      disclosures.forEach(details => details.addEventListener("keydown", event => {
        if (event.key === "Escape" && details.open) {
          details.open = false;
          details.querySelector("summary").focus();
        }
      }));
      el.refreshBtn.addEventListener("click", loadData);
      el.dashboardContent.addEventListener("click", event => {
        const button = event.target.closest("[data-dashboard-region]");
        if (button) openDashboardRegion(button.dataset.dashboardRegion, button.hasAttribute("data-dashboard-unvisited"));
      });
      el.exportBtn.addEventListener("click", exportStates);
      el.logoutBtn.addEventListener("click", logout);
      el.usersBtn.addEventListener("click", openUsers);
      el.salespeopleBtn.addEventListener("click", openSalespeople);
      el.logsBtn.addEventListener("click", openLogs);
      el.userForm.addEventListener("submit", createUser);

            <div class="analytics-activity-group">
              <h3>本週動態 <span>${dashboardDate.format(week.start)} 至 ${dashboardDate.format(week.end - 1)}</span></h3>
              <dl><div><dt>更新客戶</dt><dd>${n(weeklyUpdates)}</dd></div>
                <div><dt>更新且有回報</dt><dd>${n(weeklyNotes)}</dd></div></dl>
            </div>
          </section>
        </div>
        <div class="analytics-work">
          <section class="analytics-regions" aria-labelledby="analyticsRegionsTitle">
            <header class="analytics-section-heading">
              <div><h3 id="analyticsRegionsTitle">區域戰情</h3><span class="analytics-unit">${regions.filter(row => row.region).length} 個區域</span></div>
              <div class="analytics-sort"><label for="dashboardSort">排序</label><select id="dashboardSort">${Object.entries(dashboardSorts).map(([value, name]) => `<option value="${value}" ${state.dashboardSort === value ? "selected" : ""}>${name}</option>`).join("")}</select></div>
            </header>
            <div class="analytics-table-scroll" role="region" aria-label="各區數據比較" tabindex="0">
              <table class="analytics-table">
                <thead><tr><th scope="col">區域</th><th scope="col">拜訪進度</th><th scope="col">未拜訪</th><th scope="col">待追蹤</th><th scope="col">A＋AA</th><th scope="col">未分級</th></tr></thead>
                <tbody id="analyticsRegionsBody">${renderRegionRows(regions)}</tbody>
              </table>
            </div>
          </section>
          <section class="analytics-priority" aria-labelledby="analyticsPriorityTitle">
            <header class="analytics-section-heading"><div><h3 id="analyticsPriorityTitle">優先補強</h3><span class="analytics-unit">${priority.length} 區</span></div></header>
            <p class="analytics-rule">${minimum ? `名單數達區域平均（至少 ${n(minimum)} 家），且拜訪率低於 15%` : "拜訪率低於 15%，且名單數達區域平均"}</p>
            ${priority.length ? `<ol class="analytics-priority-list">${priority.map(row => `
              <li><button type="button" data-dashboard-region="${escapeHtml(row.region)}" data-dashboard-unvisited aria-label="查看${escapeHtml(row.region)}未拜訪客戶">
                <div><strong>${escapeHtml(row.region)}</strong><small>拜訪率 ${row.rate.toFixed(1)}% · A＋AA ${n(row.high)} 家</small></div>
                <span class="priority-remaining"><strong>${n(row.remaining)}</strong><small>未拜訪</small></span>
                <i data-lucide="chevron-right"></i>
              </button></li>`).join("")}</ol>` : '<p class="analytics-empty">目前沒有符合門檻的區域</p>'}
          </section>
        </div>`;
      document.getElementById("dashboardSort").addEventListener("change", event => {
        state.dashboardSort = event.target.value;
        document.getElementById("analyticsRegionsBody").innerHTML = renderRegionRows(regions);
        refreshIcons();
      });
      refreshIcons();
    }

    function renderRegionRows(regions) {
      const n = dashboardNumber.format.bind(dashboardNumber);
      const byName = (a, b) => a.region.localeCompare(b.region, "zh-Hant");
      const sort = { count: (a, b) => b.total - a.total, rate: (a, b) => a.rate - b.rate, follow: (a, b) => b.follow - a.follow }[state.dashboardSort];
      return [...regions].sort((a, b) => Number(!a.region) - Number(!b.region) || sort(a, b) || b.total - a.total || byName(a, b))
        .map(row => `<tr>
          <th scope="row">${row.region ? `<button type="button" class="analytics-region-link" data-dashboard-region="${escapeHtml(row.region)}">
            ${escapeHtml(row.region)}<i data-lucide="arrow-up-right"></i></button>` : "未填區域"}</th>
          <td class="analytics-row-progress">
            <div><strong>${row.rate.toFixed(1)}%</strong><span>${n(row.visited)} / ${n(row.total)} 家</span></div>
            <div class="visit-progress" aria-hidden="true"><span style="width:${row.rate}%"></span></div>
          </td>
          <td>${n(row.remaining)}</td><td>${n(row.follow)}</td><td>${n(row.high)}</td><td>${n(row.ungraded)}</td>
        </tr>`).join("");
    }

    function dashboardStats(week, records = state.records) {
      const groups = new Map();
      let visited = 0, high = 0, follow = 0, weeklyUpdates = 0, weeklyNotes = 0;
      for (const record of records) {
        const local = getLocal(record);
        const grade = effectiveGrade(record);
        const hasReport = hasFeedback(record);
        const highValue = isHighValue(record);
        const needsFollow = isFollowStatus(local.status);
        const updatedAt = Date.parse(local.updatedAt);
        if (updatedAt >= week.start && updatedAt < week.end) {
          weeklyUpdates++;
          if (clean(local.note)) weeklyNotes++;
        }
        const region = record.region || "";
        if (!groups.has(region)) groups.set(region, { region, total: 0, visited: 0, high: 0, follow: 0, ungraded: 0 });
        const row = groups.get(region);
        row.total++;
        row.visited += Number(hasReport);
        row.high += Number(highValue);
        row.follow += Number(needsFollow);
        row.ungraded += Number(isUngraded(grade));
        visited += Number(hasReport);
        high += Number(highValue);
        follow += Number(needsFollow);
      }
      const rows = [...groups.values()];
      const named = rows.filter(row => row.region);
      const minimum = named.length ? Math.ceil(named.reduce((sum, row) => sum + row.total, 0) / named.length) : 0;
      const regions = rows.map(row => {
        const rate = dashboardRate(row.visited, row.total);
        return { ...row, rate, remaining: row.total - row.visited, priority: Boolean(row.region) && row.total >= minimum && rate < 15 };
      });
      return { total: records.length, visited, high, follow, weeklyUpdates, weeklyNotes, regions, minimum };
    }

    function dashboardRate(value, total) {
      return total ? value / total * 100 : 0;
    }

    function dashboardWeek(now = Date.now()) {
      const taipeiOffset = 8 * 60 * 60 * 1000;
      const day = new Date(now + taipeiOffset);
      day.setUTCHours(0, 0, 0, 0);
      day.setUTCDate(day.getUTCDate() - (day.getUTCDay() + 6) % 7);
      const start = day.getTime() - taipeiOffset;
      return { start, end: start + 7 * 24 * 60 * 60 * 1000 };
    }

    function openDashboardRegion(region, unvisited) {
      el.searchInput.value = "";
      el.gradeFilter.value = "";
      el.statusFilter.value = "";
      el.quickFilter.value = unvisited ? "needsFeedback" : "";
      el.regionFilter.value = region;
      el.listView.classList.remove("show-mobile-detail");
      switchView("list");
      applyFilters();
      el.searchInput.focus();
    }
    async function openUsers(){if(state.currentUser.role!=="admin")return;el.usersModal.classList.add("show");await loadUsers();refreshIcons()}
    async function loadUsers(){const [data,storage]=await Promise.all([api("/api/users"),api("/api/storage-status")]);renderStorageStatus(storage);el.usersBody.innerHTML=data.users.map(u=>`<tr><td>${escapeHtml(u.username)}</td><td><input value="${escapeHtml(u.displayName||"")}" data-field="displayName" data-id="${u.id}"></td><td><select data-field="role" data-id="${u.id}"><option value="user" ${u.role==="user"?"selected":""}>一般使用者</option><option value="admin" ${u.role==="admin"?"selected":""}>管理員</option></select></td><td><select data-field="active" data-id="${u.id}"><option value="true" ${u.active?"selected":""}>啟用</option><option value="false" ${!u.active?"selected":""}>停用</option></select></td><td><input type="password" placeholder="留空不變" data-field="password" data-id="${u.id}"></td><td><button class="mini-button" data-save-user="${u.id}"><i data-lucide="save"></i></button></td></tr>`).join("");el.usersBody.querySelectorAll("[data-save-user]").forEach(b=>b.addEventListener("click",()=>updateUser(b.dataset.saveUser)));refreshIcons()}
    function renderStorageStatus(storage){const protectedStore=storage.likelyPersistent||storage.remoteBackupEnabled;el.usersStorageStatus.classList.toggle("warning",!protectedStore);el.usersStorageStatus.textContent=storage.likelyPersistent?`儲存位置：${storage.dataDir}`:storage.remoteBackupEnabled?`儲存位置：${storage.dataDir}，並已啟用 Google Sheet 後端備份，Render 重開後會自動還原。`:`警告：目前資料目錄不是持久化磁碟，且尚未啟用 Google Sheet 後端備份，重開或重新部署後資料會消失。現在位置：${storage.dataDir}`}
    async function createUser(e){e.preventDefault();try{await api("/api/users",{method:"POST",body:JSON.stringify({username:el.newUsername.value.trim(),displayName:el.newDisplayName.value.trim(),role:el.newRole.value,password:el.newPassword.value})});el.userForm.reset();showToast("使用者已新增並確認寫入");await loadUsers()}catch(error){showToast(error.message||"使用者新增失敗")}}
    async function updateUser(id){try{const values={};el.usersBody.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach(input=>{if(input.dataset.field==="active")values.active=input.value==="true";else if(input.value)values[input.dataset.field]=input.value});await api(`/api/users/${encodeURIComponent(id)}`,{method:"PUT",body:JSON.stringify(values)});showToast("使用者已更新並確認寫入");await loadUsers()}catch(error){showToast(error.message||"使用者更新失敗")}}
    async function openSalespeople(){if(state.currentUser.role!=="admin")return;el.salespeopleModal.classList.add("show");await loadSalespeople();refreshIcons()}
    async function loadSalespeople(){const data=await api("/api/salespeople");state.salespeople=data.salespeople||[];el.salespeopleBody.innerHTML=state.salespeople.map(p=>`<tr><td><input value="${escapeHtml(p.name||"")}" data-sales-field="name" data-id="${p.id}"></td><td><select data-sales-field="active" data-id="${p.id}"><option value="true" ${p.active!==false?"selected":""}>啟用</option><option value="false" ${p.active===false?"selected":""}>停用</option></select></td><td>${formatDate(p.createdAt)}</td><td><button class="mini-button" data-save-salesperson="${p.id}"><i data-lucide="save"></i></button></td></tr>`).join("");el.salespeopleBody.querySelectorAll("[data-save-salesperson]").forEach(b=>b.addEventListener("click",()=>updateSalesperson(b.dataset.saveSalesperson)));renderDetail();refreshIcons()}
    async function createSalesperson(e){e.preventDefault();try{await api("/api/salespeople",{method:"POST",body:JSON.stringify({name:el.newSalespersonName.value.trim(),active:el.newSalespersonActive.value==="true"})});el.salespersonForm.reset();showToast("業務人員已新增");await loadSalespeople()}catch(error){showToast(error.message||"業務人員新增失敗")}}
    async function updateSalesperson(id){try{const values={};el.salespeopleBody.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach(input=>{if(input.dataset.salesField==="active")values.active=input.value==="true";else values[input.dataset.salesField]=input.value.trim()});await api(`/api/salespeople/${encodeURIComponent(id)}`,{method:"PUT",body:JSON.stringify(values)});showToast("業務人員已更新");await loadSalespeople()}catch(error){showToast(error.message||"業務人員更新失敗")}}
    async function openLogs() {
      if (state.currentUser.role !== "admin") return;
      const [data, history] = await Promise.all([
        api("/api/audit-logs?limit=150"),
        api("/api/customer-sheet-history").catch(() => null)
      ]);
      el.logsBody.innerHTML = data.auditLogs.map(log => `<tr><td>${formatDate(log.at)}</td><td>${escapeHtml(log.username||"-")}</td><td>${escapeHtml(actionLabel(log.action))}</td><td>${log.success?"成功":"失敗"}</td><td>${escapeHtml(JSON.stringify(log.details||{}))}</td></tr>`).join("");
      renderSheetHistory(history);
      el.logsModal.classList.add("show");
      refreshIcons();
    }

    function renderSheetHistory(history) {
      let section = document.getElementById("customerSheetHistory");
      if (!section) {
        section = document.createElement("section");
        section.id = "customerSheetHistory";
        el.logsBody.closest("table").before(section);
      }
      const dates = new Intl.DateTimeFormat("zh-TW", { dateStyle: "short", timeStyle: "medium", timeZone: "Asia/Taipei" });
      const at = value => value ? dates.format(new Date(value)) : "尚無紀錄";
      const name = source => source.gid === null ? "舊表" : "客戶表（分頁 " + source.gid + "）";
      const records = history ? Object.entries(history.sources) : [];
      const sources = records.map(([key, source]) => {
        const link = "https://docs.google.com/spreadsheets/d/" + encodeURIComponent(source.spreadsheetId) + "/edit"
          + (source.gid === null ? "" : "#gid=" + encodeURIComponent(source.gid));
        return `<li><a href="${link}" target="_blank" rel="noopener">${escapeHtml(name(source))}</a>
          ${key === history.active ? "（目前使用）" : ""}｜最後讀取 ${at(source.lastReadAt)}｜最後寫入總表 ${at(source.lastWriteAt)}</li>`;
      }).join("");
      const switches = (history?.switches || []).slice(-10).reverse().map(change => {
        const from = change.from ? name(history.sources[change.from]) : "首次記錄";
        return `<li>${at(change.at)}｜${escapeHtml(from)} → ${escapeHtml(name(history.sources[change.to]))}</li>`;
      }).join("");
      section.innerHTML = `<h3>資料來源紀錄（台灣時間）</h3>${sources ? `<ul>${sources}</ul>` : `<p>${history ? "尚無紀錄" : "無法載入資料來源紀錄"}</p>`}
        ${switches ? `<details><summary>最近切換紀錄</summary><ul>${switches}</ul></details>` : ""}`;
    }
    function selectRecord(id) {
      if (state.selectedId !== id) {
        state.selectedId = id;
        state.detailPane = "profile";
        renderTable();
        renderDetail();
        refreshIcons();
      }
      if (matchMedia("(max-width: 720px)").matches) {
        el.listView.classList.add("show-mobile-detail");
        document.getElementById("selectedCustomerTitle")?.focus();
      } else {
        el.tableBody.querySelector('.customer-select[aria-pressed="true"]')?.focus({ preventScroll: true });
      }
    }
    function getLocal(recordOrId){const record=typeof recordOrId==="object"?recordOrId:state.records.find(r=>r.id===recordOrId)||state.records.find(r=>r.localKey===recordOrId);const primary=typeof recordOrId==="string"?recordOrId:recordOrId?.localKey||recordOrId?.id;return{status:"todo",grade:"",note:"",nextDate:"",salesperson:"",agencyType:"",...(state.local[primary]||{}),...((!state.local[primary]&&record?.id)?state.local[record.id]||{}:{}),...((!state.local[primary]&&record?.factoryId)?state.local[record.factoryId]||{}:{})}}
    function effectiveGrade(r){const g=getLocal(r).grade;return g&&g!=="未分級"?g:(g==="未分級"?"未分級":(r.grade||"未分級"))}
    function getFeedbackText(r){const local=getLocal(r);const saved=clean(r.feedback),note=clean(local.note);return note&&!saved.includes(note)?[saved,note].filter(Boolean).join("\n"):saved}function hasFeedback(r){return Boolean(clean(getFeedbackText(r)))}function normalizeStatus(status){return status==="待追蹤"?"follow":status==="已拜訪"?"visited":status==="暫不處理"?"closed":status==="未處理"?"todo":status||"todo"}function isFollowStatus(status){return normalizeStatus(status)==="follow"}
    function isHighValue(r){return ["A","AA"].includes(effectiveGrade(r))}
    function isUngraded(g){return !g||g==="未分級"}
    function infoRow(label,value){return`<div class="info-row"><dt>${label}</dt><dd>${value||`<span class="subtext">未填</span>`}</dd></div>`}
    function gradeBadge(grade){const g=grade||"未分級",c=g==="未分級"?"grade-empty":`grade-${g.toLowerCase()}`;return`<span class="grade ${c}">${escapeHtml(g)}</span>`}
    function statusBadge(status){const s=normalizeStatus(status);return`<span class="local-status ${s}">${statusLabels[s]||"未處理"}</span>`}
    function shortText(t,l){const v=clean(t).replace(/\s+/g," ");return v.length>l?`${v.slice(0,l)}...`:v}
    function clean(v){return String(v??"").replace(/\u00a0/g," ").trim()}
    async function copyRecord(r){const local=getLocal(r);await navigator.clipboard.writeText([`公司：${r.company}`,`分級：${effectiveGrade(r)}`,`區域：${r.region}`,`負責人：${r.owner||""}`,`電話：${r.phone||""}`,`地址：${r.address||""}`,`開發業務：${local.salesperson||""}`,`代辦業者：${local.agencyType||""}`,`追蹤狀態：${statusLabels[local.status]}`,`拜訪回報：${r.feedback||""}`,`追蹤備註：${local.note||""}`].join("\n"));showToast("已複製客戶資料")}
    function exportStates(){const blob=new Blob([JSON.stringify(state.local,null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=`factory-crm-states-${new Date().toISOString().slice(0,10)}.json`;link.click();URL.revokeObjectURL(url)}
    function percentNumber(v,b){return b?`${Math.round(v/b*100)}%`:"0%"}
    function setLoading(v){state.dataLoading=v;el.loadingBox.style.display=v?"block":"none";if(state.activeView==="dashboard")renderDashboard()}
    function showError(m){state.dataError=m;el.errorBox.textContent=m;el.errorBox.style.display="block"}
    function hideError(){state.dataError="";el.errorBox.style.display="none";el.errorBox.textContent=""}
    function showToast(m){el.toast.textContent=m;el.toast.classList.add("show");clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.toast.classList.remove("show"),2200)}
    function formatDate(v){return v?new Date(v).toLocaleString("zh-TW",{hour12:false}):""}
    function actionLabel(a){return({LOGIN:"登入",LOGOUT:"登出",LOGIN_FAILED:"登入失敗",SAVE_CUSTOMER_STATE:"儲存客戶資料",CREATE_USER:"新增使用者",UPDATE_USER:"更新使用者",CREATE_SALESPERSON:"新增業務人員",UPDATE_SALESPERSON:"更新業務人員",UPDATE_CUSTOMER_PROFILE:"更新客戶基本資料"})[a]||a}
    function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
  </script>
